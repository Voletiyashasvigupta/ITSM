trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: Use Node.js 22

  - script: |
      npm ci
      npm test
      npm run build
    workingDirectory: frontend
    displayName: Build React portal

  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '25'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled
    displayName: Use Java 25

  - script: mvn -B verify
    workingDirectory: backend
    displayName: Build Spring Boot services
