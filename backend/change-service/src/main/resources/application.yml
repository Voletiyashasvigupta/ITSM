server:
  port: ${PORT:${SERVER_PORT:8091}}
spring:
  application:
    name: change-service
  datasource:
    url: ${MYSQL_URL:${DB_URL:jdbc:mysql://localhost:3306/change_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
    username: ${MYSQL_USER:${DB_USERNAME:root}}
    password: ${MYSQL_PASSWORD:${DB_PASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
app:
  security:
    open-access: ${OPEN_ACCESS:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    com.itsm.changemanagement: INFO
    org.springframework.security: INFO
