server:
  port: ${PORT:8080}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: catalog-service
              uri: lb://CATALOG-SERVICE
              predicates: [Path=/api/catalog/**]
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates: [Path=/api/auth/**]
            - id: servicenow-integration
              uri: lb://SERVICENOW-INTEGRATION
              predicates: [Path=/api/integration/**]
              filters: [StripPrefix=1]
            - id: request-service
              uri: lb://REQUEST-SERVICE
              predicates: [Path=/api/requests/**]
            - id: approval-service-local
              uri: lb://REQUEST-SERVICE
              predicates: [Path=/api/approvals/**]
            - id: sla-service
              uri: lb://SLA-SERVICE
              predicates: [Path=/api/slas/**]
            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates: [Path=/api/notifications/**]
            - id: reporting-service
              uri: lb://REPORTING-SERVICE
              predicates: [Path=/api/reports/**]
            - id: incident-service
              uri: lb://INCIDENT-SERVICE
              predicates: [Path=/api/incidents/**]
            - id: problem-service
              uri: lb://PROBLEM-SERVICE
              predicates: [Path=/api/problems/**]
            - id: change-service
              uri: lb://CHANGE-SERVICE
              predicates: [Path=/api/changes/**]
            - id: cab-service
              uri: lb://CHANGE-SERVICE
              predicates: [Path=/api/cab/**]
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: Authorization,Content-Type,Idempotency-Key,X-Correlation-ID
                allow-credentials: true
security:
  jwt:
    secret: ${JWT_SIGNING_SECRET:lrsOqxVRR53Tv6VUOZ4ZRW4G4mI5FlU0ODDQUvua6o-lcBbdH_2zuzTbzhg5mDik}
    issuer: ${JWT_ISSUER_URI:northstar-auth}
    audience: ${JWT_AUDIENCE:northstar-portal}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
