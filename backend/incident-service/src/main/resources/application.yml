server:
  port: ${PORT:8087}
spring:
  application:
    name: incident-service
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/northstar_incident_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
security:
  jwt:
    secret: ${JWT_SIGNING_SECRET:lrsOqxVRR53Tv6VUOZ4ZRW4G4mI5FlU0ODDQUvua6o-lcBbdH_2zuzTbzhg5mDik}
    issuer: ${JWT_ISSUER_URI:northstar-auth}
    audience: ${JWT_AUDIENCE:northstar-portal}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
